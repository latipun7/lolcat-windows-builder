name: Build lolcat for Windows

on:
  schedule:
    - cron: '0 3 * * *'  # Daily check at 03:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'lolcat version to build (leave empty for latest tag)'
        required: false
        type: string

env:
  UPSTREAM_REPO: jaseg/lolcat

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream for new tag
        id: check
        run: |
          # Manual trigger override
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch latest tags from upstream
          TAGS=$(curl -sL "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=10" \
            | jq -r '.[].name' | grep -E '^v?[0-9]+\.' | head -5)

          if [ -z "$TAGS" ]; then
            echo "No tags found upstream"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get latest tag
          LATEST=$(echo "$TAGS" | head -1)
          VERSION="${LATEST#v}"
          TAG="v${VERSION}"

          echo "Latest upstream tag: ${TAG}"

          # Check if we already built this version
          EXISTING=$(curl -sL \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
            | jq -r '.tag_name // empty')

          if [ "$EXISTING" = "$TAG" ]; then
            echo "Already built ${TAG}, skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version found: ${TAG}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            git
            make

      - name: Clone and build lolcat
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="${{ needs.check-release.outputs.tag }}"

          # Clone upstream at specific tag
          git clone --depth 1 --branch "${TAG}" \
            "https://github.com/${UPSTREAM_REPO}.git" lolcat-src

          cd lolcat-src

          # Build
          make lolcat

          # Prepare distribution
          DIST_DIR="lolcat-${VERSION}-windows-x64"
          mkdir -p "../${DIST_DIR}"
          cp lolcat.exe "../${DIST_DIR}/"
          cp LICENSE "../${DIST_DIR}/" 2>/dev/null || true
          cp README.md "../${DIST_DIR}/" 2>/dev/null || true

          cd ..

          # Create launcher batch script
          cat > "${DIST_DIR}/lolcat.bat" << 'BATCH'
          @echo off
          "%~dp0lolcat.exe" %*
          BATCH

          # Create README
          cat > "${DIST_DIR}/README.md" << EOF
          # lolcat for Windows

          **Version:** ${VERSION}
          **Source:** https://github.com/${UPSTREAM_REPO}

          ## Usage

          ### Command Prompt (cmd.exe)
          \`\`\`
          echo Hello World | lolcat.exe
          type myfile.txt | lolcat.exe
          dir | lolcat.exe
          \`\`\`

          ### PowerShell
          \`\`\`
          echo "Hello World" | .\lolcat.exe
          Get-Content myfile.txt | .\lolcat.exe
          \`\`\`

          ### Add to PATH (optional)
          1. Extract this folder to a permanent location (e.g., \`C:\\Tools\\lolcat\`)
          2. Add that folder to your PATH environment variable
          3. Use \`lolcat\` from anywhere

          ## About

          This is a high-performance C implementation of lolcat.
          >10x faster and <0.1% as large as the original Ruby version.

          - Original: https://github.com/busyloop/lolcat
          - C implementation: https://github.com/${UPSTREAM_REPO}
          EOF

      - name: Create ZIP
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          cd "lolcat-${VERSION}-windows-x64"
          zip -r "../lolcat-${VERSION}-windows-x64.zip" .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lolcat-windows
          path: lolcat-*-windows-x64.zip

  release:
    needs: [check-release, build-windows]
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lolcat-windows
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: "lolcat ${{ needs.check-release.outputs.version }} (Windows)"
          body: |
            ## lolcat ${{ needs.check-release.outputs.version }} for Windows

            Standalone Windows build of [lolcat](https://github.com/jaseg/lolcat) — the high-performance C implementation.

            ### Installation
            1. Download `lolcat-${{ needs.check-release.outputs.version }}-windows-x64.zip`
            2. Extract to a folder (e.g., `C:\Tools\lolcat`)
            3. Add folder to PATH (optional)

            ### Usage
            ```
            echo Hello World | lolcat.exe
            type myfile.txt | lolcat.exe
            dir | lolcat.exe
            ```

            ### What's included
            - `lolcat.exe` — standalone binary (~50KB)
            - `lolcat.bat` — launcher script

            ### Why this build?
            The original [busyloop/lolcat](https://github.com/busyloop/lolcat) is a Ruby gem with no Windows support.
            This uses [jaseg/lolcat](https://github.com/jaseg/lolcat), a C reimplementation that's **>10x faster** and **<0.1% the size**.

            ---
            *Built automatically from [jaseg/lolcat](https://github.com/jaseg/lolcat) release ${{ needs.check-release.outputs.tag }}*
          files: ./artifacts/*
          draft: false
          prerelease: false
